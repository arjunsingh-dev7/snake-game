<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Arena</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      touch-action: manipulation;
    }
    header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: bold;
    }
    .badge { background: #21262d; padding: 4px 10px; border-radius: 12px; border: 1px solid #30363d; }
    #canvas-container {
      position: relative;
      width: 92vw;
      max-width: 380px;
      aspect-ratio: 1;
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    canvas { width: 100%; height: 100%; display: block; }
    
    /* Overlay Forms */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(13, 17, 23, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 22px; color: #2ea043; margin-bottom: 12px; }
    input[type="text"] {
      width: 80%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #fff;
      font-size: 16px;
      margin-bottom: 16px;
      text-align: center;
      outline: none;
    }
    button {
      background: #238636;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active { transform: scale(0.96); }

    /* Leaderboard */
    .history-box {
      width: 90%;
      background: #21262d;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      font-size: 12px;
      text-align: left;
    }
    .history-title { font-weight: bold; margin-bottom: 6px; color: #58a6ff; }
    .history-item { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid #30363d; }

    /* Touch Controls */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 50px);
      gap: 8px;
      margin-top: 12px;
    }
    .btn-ctrl {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 10px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e6edf3;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">Player: <span id="playerNameDisplay" style="color:#58a6ff;">Guest</span></div>
    <div class="badge">Score: <span id="scoreDisplay" style="color:#2ea043;">0</span></div>
  </header>

  <div id="canvas-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- Start / Player Name Modal -->
    <div id="startOverlay" class="overlay">
      <h2>🐍 Snake Arena</h2>
      <input type="text" id="playerNameInput" placeholder="Apna Naam Likhein" maxlength="12">
      <button onclick="startGame()">Play Game</button>
      
      <div class="history-box" id="recentScoresBox">
        <div class="history-title">Recent 5 Games</div>
        <div id="recentScoresList">No games yet</div>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameOverOverlay" class="overlay hidden">
      <h2 style="color: #f85149;">Game Over!</h2>
      <p style="margin-bottom: 10px;">Final Score: <span id="finalScore" style="color:#58a6ff;font-weight:bold;">0</span></p>
      <button onclick="restartGame()">Play Again</button>
    </div>
  </div>

  <!-- Mobile Direction Controls -->
  <div class="controls">
    <div></div>
    <button class="btn-ctrl" onclick="changeDirection('UP')">⬆</button>
    <div></div>
    <button class="btn-ctrl" onclick="changeDirection('LEFT')">⬅</button>
    <button class="btn-ctrl" onclick="changeDirection('DOWN')">⬇</button>
    <button class="btn-ctrl" onclick="changeDirection('RIGHT')">➡</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Chhota size: 400x400 me 25x25 cells (har cell 16px)
    const gridSize = 16;
    const tileCount = 25;

    let snake = [];
    let food = { x: 10, y: 10 };
    let dx = gridSize, dy = 0;
    let nextDx = gridSize, nextDy = 0;
    let score = 0;
    let gameInterval = null;
    let currentPlayer = "Guest";

    // --- Web Audio Generator (Bina kisi extra audio file ke sound) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'eat') {
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'die') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      }
    }

    // --- Leaderboard & History ---
    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('snake_history') || '[]');
      const container = document.getElementById('recentScoresList');
      if (history.length === 0) {
        container.innerHTML = '<div>No games recorded</div>';
        return;
      }
      container.innerHTML = history.slice(0, 5).map(h => 
        `<div class="history-item"><span>${h.name}</span><span>${h.score} pts</span></div>`
      ).join('');
    }

    function saveScore(name, score) {
      let history = JSON.parse(localStorage.getItem('snake_history') || '[]');
      history.unshift({ name: name, score: score, date: new Date().toLocaleDateString() });
      if (history.length > 5) history = history.slice(0, 5);
      localStorage.setItem('snake_history', JSON.stringify(history));
    }

    // --- Game Engine ---
    function startGame() {
      const nameInput = document.getElementById('playerNameInput').value.trim();
      currentPlayer = nameInput || "Player " + Math.floor(Math.random() * 900 + 100);
      document.getElementById('playerNameDisplay').innerText = currentPlayer;
      document.getElementById('startOverlay').classList.add('hidden');
      initGame();
    }

    function restartGame() {
      document.getElementById('gameOverOverlay').classList.add('hidden');
      initGame();
    }

    function initGame() {
      snake = [
        { x: 5 * gridSize, y: 10 * gridSize },
        { x: 4 * gridSize, y: 10 * gridSize },
        { x: 3 * gridSize, y: 10 * gridSize }
      ];
      dx = gridSize; dy = 0;
      nextDx = gridSize; nextDy = 0;
      score = 0;
      document.getElementById('scoreDisplay').innerText = score;
      placeFood();
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 140);
    }

    function placeFood() {
      food.x = Math.floor(Math.random() * tileCount) * gridSize;
      food.y = Math.floor(Math.random() * tileCount) * gridSize;
    }

    function gameLoop() {
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall Collision
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        return gameOver();
      }

      // Self Collision
      for (let segment of snake) {
        if (head.x === segment.x && head.y === segment.y) return gameOver();
      }

      snake.unshift(head);

      // Eat Food (Frog)
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('scoreDisplay').innerText = score;
        playSound('eat');
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#161b22';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Food (Green frog dot with border)
      ctx.fillStyle = '#3fb950';
      ctx.beginPath();
      ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, gridSize / 2 - 1, 0, Math.PI * 2);
      ctx.fill();

      // Snake Body
      snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? '#58a6ff' : '#238636';
        ctx.fillRect(part.x + 1, part.y + 1, gridSize - 2, gridSize - 2);
      });
    }

    function gameOver() {
      clearInterval(gameInterval);
      playSound('die');
      saveScore(currentPlayer, score);
      loadHistory();
      document.getElementById('finalScore').innerText = score;
      document.getElementById('gameOverOverlay').classList.remove('hidden');
    }

    function changeDirection(dir) {
      if (dir === 'UP' && dy === 0) { nextDx = 0; nextDy = -gridSize; }
      if (dir === 'DOWN' && dy === 0) { nextDx = 0; nextDy = gridSize; }
      if (dir === 'LEFT' && dx === 0) { nextDx = -gridSize; nextDy = 0; }
      if (dir === 'RIGHT' && dx === 0) { nextDx = gridSize; nextDy = 0; }
    }

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') changeDirection('UP');
      if (e.key === 'ArrowDown') changeDirection('DOWN');
      if (e.key === 'ArrowLeft') changeDirection('LEFT');
      if (e.key === 'ArrowRight') changeDirection('RIGHT');
    });

    loadHistory();
  </script>
</body>
</html>
