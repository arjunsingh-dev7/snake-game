<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realistic Snake Slim</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      background: radial-gradient(circle, #182218 0%, #0a0d0a 100%);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      padding-top: 10px;
    }

    /* Scoreboard */
    .top-bar {
      display: flex;
      justify-content: space-between;
      width: 90%;
      max-width: 340px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 10px;
    }

    .score-val { color: #4ade80; }
    .best-val { color: #facc15; }

    /* Canvas Outer Frame */
    #board-wrap {
      position: relative;
      border-radius: 18px;
      padding: 3px;
      background: linear-gradient(145deg, #22c55e, #064e3b);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }

    canvas {
      display: block;
      background: #0f150f;
      border-radius: 15px;
    }

    /* Controls: Compact & Thumb Friendly */
    .control-panel {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(3, 72px);
      grid-template-rows: repeat(2, 68px);
      gap: 10px;
      justify-content: center;
    }

    .pad-btn {
      background: linear-gradient(145deg, #253325, #141c14);
      border: 2px solid #364d36;
      border-radius: 18px;
      color: #4ade80;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      touch-action: manipulation;
    }

    .pad-btn:active {
      background: #4ade80;
      color: #052e16;
      transform: scale(0.92);
    }

    .btn-up { grid-column: 2; grid-row: 1; }
    .btn-left { grid-column: 1; grid-row: 2; }
    .btn-down { grid-column: 2; grid-row: 2; }
    .btn-right { grid-column: 3; grid-row: 2; }

    /* Modern Overlay */
    #overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(8, 12, 8, 0.88);
      border-radius: 15px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    #overlay h2 {
      font-size: 24px;
      color: #ef4444;
    }

    #start-btn {
      padding: 10px 26px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 30px;
      border: none;
      background: #22c55e;
      color: #052e16;
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div>🐸 Score: <span id="score" class="score-val">0</span></div>
    <div>🏆 Best: <span id="best" class="best-val">0</span></div>
  </div>

  <div id="board-wrap">
    <canvas id="gameCanvas" width="320" height="320"></canvas>
    
    <div id="overlay">
      <h2 id="over-title">Snake Game</h2>
      <p id="over-score">Press Start to Play</p>
      <button id="start-btn" onclick="startGame()">Khel Shuru Karein</button>
    </div>
  </div>

  <div class="control-panel">
    <button class="pad-btn btn-up" id="up">▲</button>
    <button class="pad-btn btn-left" id="left">◀</button>
    <button class="pad-btn btn-down" id="down">▼</button>
    <button class="pad-btn btn-right" id="right">▶</button>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // 20x20 Grid (Cell size ab chhota hokar ~16px ho gaya)
    const GRID = 20;
    const CELL = canvas.width / GRID;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let score = 0;
    let best = localStorage.getItem("snake_best") || 0;
    let loop = null;
    let isRunning = false;

    document.getElementById("best").innerText = best;

    function reset() {
      const mid = Math.floor(GRID / 2);
      // Shuru me 4 chote segments
      snake = [
        { x: mid, y: mid },
        { x: mid - 1, y: mid },
        { x: mid - 2, y: mid }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      document.getElementById("score").innerText = 0;
      spawnFood();
      draw();
    }

    function spawnFood() {
      while (true) {
        let fx = Math.floor(Math.random() * GRID);
        let fy = Math.floor(Math.random() * GRID);
        if (!snake.some(s => s.x === fx && s.y === fy)) {
          food = { x: fx, y: fy };
          break;
        }
      }
    }

    function setDirection(dx, dy) {
      if (!isRunning) return;
      if (dx === -dir.x && dx !== 0) return;
      if (dy === -dir.y && dy !== 0) return;
      nextDir = { x: dx, y: dy };
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall Collision Check
      if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
        return gameOver();
      }

      // Self Collision Check
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById("score").innerText = score;
        if (navigator.vibrate) navigator.vibrate(35);
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = "#0c120c";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle Grid lines (Halki dots/lines)
      ctx.strokeStyle = "#141c14";
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // 1. Draw Small Frog 🐸
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      ctx.font = `${CELL * 0.9}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🐸", fx, fy);

      // 2. Draw Slim Snake
      snake.forEach((seg, i) => {
        const cx = seg.x * CELL + CELL / 2;
        const cy = seg.y * CELL + CELL / 2;
        const radius = CELL / 2 - 1.5;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);

        if (i === 0) {
          // Head
          let grad = ctx.createRadialGradient(cx - 2, cy - 2, 1, cx, cy, radius);
          grad.addColorStop(0, "#86efac");
          grad.addColorStop(1, "#16a34a");
          ctx.fillStyle = grad;
          ctx.fill();

          // Tiny Eyes
          ctx.fillStyle = "#ffffff";
          let eyeOffX = dir.y !== 0 ? 3 : 0;
          let eyeOffY = dir.x !== 0 ? 3 : 0;
          let lookX = dir.x * 2.5;
          let lookY = dir.y * 2.5;

          ctx.beginPath();
          ctx.arc(cx + eyeOffX + lookX, cy + eyeOffY + lookY, 1.8, 0, Math.PI * 2);
          ctx.arc(cx - eyeOffX + lookX, cy - eyeOffY + lookY, 1.8, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "#000000";
          ctx.beginPath();
          ctx.arc(cx + eyeOffX + lookX, cy + eyeOffY + lookY, 0.9, 0, Math.PI * 2);
          ctx.arc(cx - eyeOffX + lookX, cy - eyeOffY + lookY, 0.9, 0, Math.PI * 2);
          ctx.fill();

        } else {
          // Body
          ctx.fillStyle = i % 2 === 0 ? "#22c55e" : "#16a34a";
          ctx.fill();
        }
      });
    }

    function gameOver() {
      isRunning = false;
      clearInterval(loop);
      if (navigator.vibrate) navigator.vibrate(120);

      if (score > best) {
        best = score;
        localStorage.setItem("snake_best", best);
        document.getElementById("best").innerText = best;
      }

      document.getElementById("over-title").innerText = "Game Over! 💥";
      document.getElementById("over-score").innerText = `Final Score: ${score}`;
      document.getElementById("overlay").style.display = "flex";
    }

    function startGame() {
      document.getElementById("overlay").style.display = "none";
      reset();
      isRunning = true;
      clearInterval(loop);
      // Balanced Speed (140ms delay) - na bohot slow, na tez
      loop = setInterval(step, 140);
    }

    // Touch D-Pad Events
    const addControl = (id, x, y) => {
      const el = document.getElementById(id);
      el.addEventListener("touchstart", (e) => { e.preventDefault(); setDirection(x, y); });
      el.onclick = () => setDirection(x, y);
    };

    addControl("up", 0, -1);
    addControl("down", 0, 1);
    addControl("left", -1, 0);
    addControl("right", 1, 0);

    // Initial Screen
    reset();
    document.getElementById("overlay").style.display = "flex";
  </script>
</body>
</html>
